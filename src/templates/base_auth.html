<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Verdant.Party{% endblock %}</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
    <main class="auth-shell">
        <div class="auth-panel">
            <div class="auth-brand">
                <img src="{% static 'img/logo.jpg' %}" class="brand-logo" alt="Verdant.Party" />
                <span>Verdant.Party</span>
            </div>
            {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                <li class="message {{ message.tags }}">
                    <span class="material-icons" aria-hidden="true">{% if 'error' in message.tags %}error_outline{% elif 'success' in message.tags %}check_circle{% else %}info{% endif %}</span>
                    <span>{{ message }}</span>
                </li>
                {% endfor %}
            </ul>
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
