services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verdant}
      POSTGRES_USER: ${POSTGRES_USER:-verdant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verdant}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verdant} -d ${POSTGRES_DB:-verdant}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./src:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_DB: ${POSTGRES_DB:-verdant}
      POSTGRES_USER: ${POSTGRES_USER:-verdant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verdant}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Puste = fallback deweloperski z config/settings/dev.py.
      DJANGO_FIELD_ENCRYPTION_KEY: ${DJANGO_FIELD_ENCRYPTION_KEY:-}
      ALLEGRO_REDIRECT_URI: ${ALLEGRO_REDIRECT_URI:-}
      DJANGO_ADMIN_NOTIFICATION_EMAIL: ${DJANGO_ADMIN_NOTIFICATION_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
